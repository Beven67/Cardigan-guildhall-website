<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cardigan Guildhall Market</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============================================
         NAVIGATION
         ============================================ -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <a href="index.html" class="logo">
                 <img src="lib\images\Cardigan Guildhall market logo final (1).png" alt="Cardigan Guildhall Market logo" class="logo-image">
    <span class="logo-name">Cardigan Guildhall Market</span>
            </a>
            
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="vendors.html" class="nav-link">Vendors</a></li>
                <li><a href="events.html" class="nav-link">Events</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="history.html" class="nav-link">History</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
                <li><a href="faq.html" class="nav-link">FAQ</a></li>
                <li><a href="login.html" class="btn btn-outline nav-btn active">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- ============================================
         LOGIN SECTION
         ============================================ -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="logo" style="justify-content: center; margin-bottom: var(--space-lg);">
                    <div class="logo-icon">
                        <span class="logo-text">CGM</span>
                    </div>
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to your account to continue</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="your.email@example.com" 
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>
                
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label class="form-checkbox">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" style="font-size: var(--text-sm); color: var(--color-primary); font-weight: 500;">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In
                </button>
            </form>
                        
            <div class="auth-footer">
                <p>
                    Don't have an account? 
                    <a href="signup.html">Sign up here</a>
                </p>
            </div>
        </div>
    </section>

    <!-- ============================================
         FOOTER (Minimal for auth pages)
         ============================================ -->
    <footer style="background: var(--color-off-white); padding: var(--space-lg); text-align: center;">
        <p style="color: var(--color-gray); font-size: var(--text-sm);">
            &copy; <span id="current-year"></span> Cardigan Guildhall Market. All rights reserved.
        </p>
        <p style="color: var(--color-gray); font-size: var(--text-sm); margin-top: var(--space-sm);">
            <a href="index.html" style="color: var(--color-primary);">Home</a> • 
            <a href="contact.html" style="color: var(--color-primary);">Contact</a> • 
            <a href="faq.html" style="color: var(--color-primary);">FAQ</a>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
